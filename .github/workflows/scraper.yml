name: Pinterest Scraper
on:
  repository_dispatch:
    types: [run-scraper]
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load Pinterest session
        run: |
          echo "${{ secrets.PINTEREST_SESSION }}" | base64 -d > pinterest_session.json

      - name: Set git remote with token
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip xvfb fonts-dejavu-core fonts-freefont-ttf
          pip install playwright Pillow requests
          playwright install --with-deps

      - name: Run scraper
        run: |
          xvfb-run python scraper.py \
            "${{ github.event.client_payload.query }}" \
            "${{ github.event.client_payload.product_title }}"

      - name: Save video to repo
        run: |
          mkdir -p videos
          mv -f output.mp4 videos/latest.mp4 2>/dev/null || echo "No video to move"
          cp status.txt videos/status.txt 2>/dev/null || echo "NOT_FOUND" > videos/status.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase origin main
          git add videos/
          git commit -m "Update latest video" || echo "No changes"
          git push
