name: Pinterest Scraper

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Search query'
        required: true
        default: 'capgun opener'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg xvfb

      - name: Run scraper
        run: xvfb-run python scraper.py "${{ github.event.inputs.query }}"

      - name: Upload video
        uses: actions/upload-artifact@v3
        with:
          name: output-video
          path: output.mp4
