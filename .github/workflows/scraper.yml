- name: Save video
  run: |
    if [ -f output.mp4 ]; then
      mkdir -p videos
      cp output.mp4 videos/output.mp4

      git config user.name "github-actions"
      git config user.email "actions@github.com"

      git add videos/output.mp4
      git commit -m "Add video"
      git push
    else
      echo "No video found, skipping save"
    fi
