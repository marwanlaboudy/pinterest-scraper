name: Pinterest Scraper

on:
  repository_dispatch:
    types: [run-scraper]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Load Pinterest session
        run: |
          echo "${{ secrets.PINTEREST_SESSION }}" | base64 -d > pinterest_session.json

      - name: Set git remote with token
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip xvfb fonts-dejavu-core
          pip install playwright Pillow
          playwright install --with-deps

      - name: Run scraper
        run: |
          xvfb-run python scraper.py "${{ github.event.client_payload.query }}"

      # ✅ FIXED STEP (overwrite latest.mp4)
      - name: Save video to repo
        run: |
          mkdir -p videos

          FILENAME="latest.mp4"
          mv -f output.mp4 videos/$FILENAME

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add videos/$FILENAME
          git commit -m "Update latest video" || echo "No changes"
          git push

      # ✅ PRINT FINAL URL (no variable needed)
      - name: Print video URL
        run: |
          echo "VIDEO URL:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/main/videos/latest.mp4"
